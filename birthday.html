<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Bading 🎉</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="bg-white shadow-2xl rounded-2xl p-6 sm:p-8 max-w-md w-full text-center">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-pink-500 mb-4"> Happy Birthday Bading!</h1>
    <p class="text-base sm:text-lg text-gray-700 mb-6">
     Thank you for staying as one of my trusted friend kahit 'di man kita naga ibahan and sana next year tao ka pa din HAHAHAHA 
    </p>

    <div class="text-5xl sm:text-6xl mb-6">🎉🎈🎁</div>

    <p class="text-gray-600 italic text-sm sm:text-base">
      "Count your life by smiles, not tears. Count your age by friends, not years."
    </p>

    <button onclick="celebrate()" class="mt-6 px-6 py-3 bg-pink-500 text-white rounded-xl shadow hover:bg-pink-600 transition w-full sm:w-auto">
      Click ka didi bading  🖕!
    </button>

    <p id="surprise" class="mt-4 text-lg sm:text-xl font-semibold text-purple-600 hidden">
      I Miss Youuuuuuuu! 💖
    </p>
  </div>

  <script>
    function celebrate() {
      document.getElementById('surprise').classList.remove('hidden');

      confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 }
      });

      setTimeout(() => {
        confetti({ particleCount: 100, spread: 120, origin: { x: 0.1 } });
        confetti({ particleCount: 100, spread: 120, origin: { x: 0.9 } });
      }, 300);
    }
  </script>
</body>
</html>
